<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">What Cache Keep does while a conversation is idle</title>
  <desc id="desc">After the turn's last request, Cache Keep waits 55 minutes and pings: a fork reads the conversation from the cache, which keeps it for another hour. It pings up to five times, about five and a half hours. Then it compacts the conversation if that leaves under 60 percent of it, so the cache you come back to is smaller. A new message starts the count again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#21867e" stroke-width="2" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1400" height="430" rx="28" fill="#f7f5ee"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="34" width="1280" height="70" rx="16" fill="#153d3b"/>
    <text x="90" y="79" font-size="26" font-weight="700" fill="#fff">IDLE CONVERSATION</text>
    <text x="378" y="79" font-size="25" fill="#d6ebe7">Without a request, its prompt cache lapses after one hour</text>
    <text x="62" y="147" font-size="17" font-weight="700" letter-spacing="2" fill="#56726d">WHILE YOU ARE AWAY</text>
    <g fill="#fff" stroke="#d6e4df" stroke-width="2">
      <rect x="60" y="172" width="355" height="156" rx="20"/>
      <rect x="522" y="172" width="355" height="156" rx="20"/>
      <rect x="984" y="172" width="355" height="156" rx="20"/>
    </g>
    <g fill="#0b5450">
      <circle cx="104" cy="220" r="19" fill="#e2f1ed"/>
      <circle cx="566" cy="220" r="19" fill="#e2f1ed"/>
      <circle cx="1028" cy="220" r="19" fill="#e2f1ed"/>
      <text x="104" y="227" text-anchor="middle" font-size="19" font-weight="700">1</text>
      <text x="566" y="227" text-anchor="middle" font-size="19" font-weight="700">2</text>
      <text x="1028" y="227" text-anchor="middle" font-size="19" font-weight="700">3</text>
      <text x="138" y="230" font-size="29" font-weight="700">Last request</text>
      <text x="600" y="230" font-size="29" font-weight="700">Ping × 5</text>
      <text x="1062" y="230" font-size="29" font-weight="700">Compact</text>
    </g>
    <g fill="#536c66" font-size="23">
      <text x="87" y="284">The turn ends; the</text>
      <text x="87" y="314">55 minutes start</text>
      <text x="549" y="284">Read from the cache,</text>
      <text x="549" y="314">every 55 minutes</text>
      <text x="1011" y="284">If it leaves under 60%;</text>
      <text x="1011" y="314">else one last ping</text>
    </g>
    <path d="M425 250H510" stroke="#21867e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M887 250H972" stroke="#21867e" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M1160 340V372H240V340" stroke="#21867e" stroke-width="3" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow)"/>
    <text x="700" y="404" text-anchor="middle" font-size="22" fill="#56726d">A new message starts the count again</text>
  </g>
</svg>
