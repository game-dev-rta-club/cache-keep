<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">What 10 hours away costs</title>
  <desc id="desc">A 300k-token conversation you leave for 10 hours: the total spent so far, as a share of one full rewrite. Without Cache Keep nothing is spent while you are away, and your first message back rewrites the whole conversation: 100%. With Cache Keep, five pings add 5% each, the compaction at about five and a half hours adds 16%, and your first message back writes only the summary, adding 22%: 63% in all, 37% less.</desc>
  <rect width="1400" height="600" rx="28" fill="#f7f5ee"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="70" font-size="22" font-weight="700" letter-spacing="2" fill="#56726d">WHAT 10 HOURS AWAY COSTS</text>
    <text x="70" y="106" font-size="22" fill="#56726d">A 300k-token conversation. Total spent so far; one full rewrite = 100%.</text>
    <path d="M880 62H920" stroke="#c8692c" stroke-width="7" stroke-linecap="round"/><text x="934" y="70" font-size="22" fill="#153d3b">Without Cache Keep</text>
    <path d="M880 100H920" stroke="#21867e" stroke-width="7" stroke-linecap="round"/><text x="934" y="108" font-size="22" fill="#153d3b">With Cache Keep</text>
    <path d="M110 170H1180" stroke="#dfe3dc" stroke-width="2" stroke-dasharray="4 8"/>
    <path d="M70 490H1220" stroke="#56726d" stroke-width="3"/>
    <text x="288.3333333333333" y="526" text-anchor="middle" font-size="20" fill="#56726d">2h</text>
    <text x="466.66666666666663" y="526" text-anchor="middle" font-size="20" fill="#56726d">4h</text>
    <text x="645" y="526" text-anchor="middle" font-size="20" fill="#56726d">6h</text>
    <text x="823.3333333333333" y="526" text-anchor="middle" font-size="20" fill="#56726d">8h</text>
    <text x="110" y="530" text-anchor="middle" font-size="25" font-weight="700" fill="#153d3b">You stop</text>
    <text x="1001.6666666666667" y="530" text-anchor="middle" font-size="25" font-weight="700" fill="#153d3b">You come back</text>
    <text x="1001.6666666666667" y="560" text-anchor="middle" font-size="20" fill="#56726d">10h</text>
    <path d="M110 450H993.7V170.0H1180" fill="none" stroke="#c8692c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M110 450H191.7V436.0H273.5V422.0H355.2V408.0H436.9V394.0H518.7V380.0H600.4V335.7H1009.7V275.0H1180" fill="none" stroke="#21867e" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="191.7" cy="436.0" r="11" fill="#efb44b"/>
    <circle cx="273.5" cy="422.0" r="11" fill="#efb44b"/>
    <circle cx="355.2" cy="408.0" r="11" fill="#efb44b"/>
    <circle cx="436.9" cy="394.0" r="11" fill="#efb44b"/>
    <circle cx="518.7" cy="380.0" r="11" fill="#efb44b"/>
    <circle cx="600.4" cy="335.7" r="13" fill="#21867e" stroke="#f7f5ee" stroke-width="4"/>
    <circle cx="993.6666666666667" cy="170" r="13" fill="#c8692c" stroke="#f7f5ee" stroke-width="4"/>
    <circle cx="1009.6666666666667" cy="275" r="13" fill="#21867e" stroke="#f7f5ee" stroke-width="4"/>
    <text x="355.2083333333333" y="340" text-anchor="middle" font-size="24" fill="#8a5a12">5 pings, 5% each</text>
    <rect x="510.41666666666663" y="235.66666666666669" width="180" height="48" rx="14" fill="#21867e"/>
    <text x="600.4166666666666" y="268.6666666666667" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Compact +16%</text>
    <text x="967.6666666666667" y="231.6" text-anchor="end" font-size="22" font-weight="700" fill="#153d3b">Write it all again <tspan font-weight="400" fill="#56726d">+100%</tspan></text>
    <text x="967.6666666666667" y="313.33333333333337" text-anchor="end" font-size="22" font-weight="700" fill="#153d3b">Write only the summary <tspan font-weight="400" fill="#56726d">+22%</tspan></text>
    <rect x="1196" y="146" width="96" height="48" rx="24" fill="#c8692c"/><text x="1244" y="179" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">100%</text>
    <rect x="1196" y="251" width="96" height="48" rx="24" fill="#21867e"/><text x="1244" y="284" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">63%</text>
    <path d="M1090.8333333333333 184V261" stroke="#153d3b" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
    <rect x="1018.8333333333333" y="197.5" width="144" height="50" rx="25" fill="#fff" stroke="#153d3b" stroke-width="3"/>
    <text x="1090.8333333333333" y="231.5" text-anchor="middle" font-size="25" font-weight="700" fill="#153d3b">37% less</text>
  </g>
</svg>
